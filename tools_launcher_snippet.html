<!-- Clinical tools launcher: safe standalone links. Insert before </body>. -->
<style id="clinical-tools-launcher-style">
  #clinical-tools-launcher {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 99999;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #clinical-tools-launcher details {
    background: #ffffff;
    border: 1px solid #d0d7de;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.16);
    overflow: hidden;
    min-width: 230px;
  }
  #clinical-tools-launcher summary {
    cursor: pointer;
    list-style: none;
    padding: 12px 14px;
    font-weight: 700;
    color: #ffffff;
    background: #2563eb;
    user-select: none;
  }
  #clinical-tools-launcher summary::-webkit-details-marker { display: none; }
  #clinical-tools-launcher .tool-links {
    display: grid;
    gap: 8px;
    padding: 12px;
    background: #ffffff;
  }
  #clinical-tools-launcher a {
    display: block;
    padding: 10px 12px;
    border-radius: 10px;
    text-decoration: none;
    color: #111827;
    background: #f3f4f6;
    font-size: 14px;
    line-height: 1.25;
  }
  #clinical-tools-launcher a:hover { background: #e5e7eb; }
  #clinical-tools-launcher .note {
    font-size: 12px;
    color: #6b7280;
    padding: 0 12px 12px 12px;
  }
  @media (max-width: 640px) {
    #clinical-tools-launcher {
      right: 12px;
      bottom: 12px;
    }
    #clinical-tools-launcher details { min-width: 210px; }
  }
</style>

<div id="clinical-tools-launcher">
  <details>
    <summary>臨床工具</summary>
    <div class="tool-links">
      <a href="./tools/renal.html" target="_blank" rel="noopener">腎功能 / BSA 計算機</a>
      <a href="./tools/staging.html" target="_blank" rel="noopener">AJCC 7/8 staging 查詢</a>
      <a href="./tools/index.html" target="_blank" rel="noopener">工具首頁</a>
    </div>
    <div class="note">Standalone tools，不影響主系統資料。</div>
  </details>
</div>
