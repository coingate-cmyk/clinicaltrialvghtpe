name: Add homepage QR code

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_homepage_qr.py'
      - '.github/workflows/homepage-qr.yml'

permissions:
  contents: write

jobs:
  homepage-qr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install QR generator
        run: python -m pip install --quiet qrcode

      - name: Add homepage QR card
        run: python scripts/patch_homepage_qr.py

      - name: Validate homepage QR and JavaScript
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          if (!html.includes('homepage-qr-20260904')) throw new Error('Homepage QR marker missing');
          if (!html.includes('https://coingate-cmyk.github.io/clinicaltrialvghtpe/')) throw new Error('QR target URL missing');
          if (!html.includes('data:image/svg+xml;base64,')) throw new Error('Inline QR SVG missing');
          if (!html.includes('手機掃描開啟系統')) throw new Error('Homepage QR label missing');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(m => m[1]).filter(s => s.trim());
          scripts.forEach((script, i) => new vm.Script(script, {filename:`inline-${i}.js`}));
          console.log(`Homepage QR validated; JavaScript syntax OK (${scripts.length} inline scripts).`);
          NODE

      - name: Commit homepage QR to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add QR code to clinical trial homepage"
            git push origin main
          fi
          cp index.html /tmp/homepage-qr-index.html

      - name: Publish homepage QR to Pages
        run: |
          set -euo pipefail
          git fetch origin pages-clean-ajcc-v2-3
          git switch -C pages-clean-ajcc-v2-3 origin/pages-clean-ajcc-v2-3
          cp /tmp/homepage-qr-index.html index.html
          cp /tmp/homepage-qr-index.html 404.html
          git add index.html 404.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish homepage QR code"
            git push origin pages-clean-ajcc-v2-3
          fi
