name: One-off apply Study Status 2026-11-22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-study-status-20261122-once.yml'

permissions:
  contents: read

jobs:
  upsert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upsert 2026-11-22 Study Status into Firestore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess, urllib.parse, urllib.request

          html = open('index.html', encoding='utf-8').read()

          def extract_json(pattern, label):
              m = re.search(pattern, html, re.S)
              if not m:
                  raise SystemExit('Cannot locate ' + label)
              return json.loads(m.group(1))

          snapshot = extract_json(r"const STUDY_STATUS_SNAPSHOT_20261122 = (\{[\s\S]*?\});\nconst STUDY_STATUS_NEW_TRIALS_20261122", 'snapshot')
          additions = extract_json(r"const STUDY_STATUS_NEW_TRIALS_20261122 = (\[[\s\S]*?\]);\n\nconst applyStudyStatusSnapshot20261122", 'additions')

          def cfg(name):
              m = re.search(r"%s:\s*'([^']+)'" % name, html)
              if not m:
                  raise SystemExit('Missing Firebase ' + name)
              return m.group(1)

          api_key = cfg('apiKey')
          project_id = cfg('projectId')

          auth_req = urllib.request.Request(
              'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + urllib.parse.quote(api_key),
              data=b'{"returnSecureToken":true}',
              headers={'Content-Type':'application/json'},
              method='POST'
          )
          with urllib.request.urlopen(auth_req) as resp:
              token = json.load(resp)['idToken']

          def fv(v):
              if v is None:
                  return {'nullValue': None}
              if isinstance(v, bool):
                  return {'booleanValue': v}
              if isinstance(v, (int,float)):
                  return {'doubleValue': float(v)}
              if isinstance(v, list):
                  return {'arrayValue': {'values': [fv(x) for x in v]}}
              if isinstance(v, dict):
                  return {'mapValue': {'fields': {k: fv(x) for k,x in v.items()}}}
              return {'stringValue': str(v)}

          additions_by_code = {str(x.get('code','')).upper(): x for x in additions}
          stamp = {
              'studyStatusSnapshotVersion':'v4.4.0-20261122-study-status-pdf',
              'studyStatusSnapshotDate':'2026-11-22',
              'statusSource':'explicit-field',
              'statusDetectedFromText':False
          }

          items = []
          for code, patch in snapshot.items():
              doc = dict(patch)
              doc.update(stamp)
              doc['code'] = code
              items.append((code, doc))
          for code, src in additions_by_code.items():
              canonical = src.get('code') or code
              doc = dict(src)
              doc.update(stamp)
              doc['code'] = canonical
              items.append((canonical, doc))

          # additions are also in snapshot; keep the full addition payload for those codes.
          merged = {}
          for code, doc in items:
              key = str(code).upper()
              if key in additions_by_code:
                  full = dict(additions_by_code[key])
                  full.update(snapshot.get(code, snapshot.get(key, {})))
                  full.update(stamp)
                  full['code'] = additions_by_code[key].get('code') or code
                  merged[key] = full
              else:
                  merged[key] = doc

          updated = 0
          for key, doc in merged.items():
              code = doc['code']
              fields = {k: fv(v) for k,v in doc.items() if k not in ('id','subjects') and v is not None}
              params = [('updateMask.fieldPaths', k) for k in fields.keys()]
              url = (
                  'https://firestore.googleapis.com/v1/projects/' + urllib.parse.quote(project_id) +
                  '/databases/(default)/documents/trials/' + urllib.parse.quote(code, safe='') +
                  '?' + urllib.parse.urlencode(params)
              )
              req = urllib.request.Request(
                  url,
                  data=json.dumps({'fields':fields}, ensure_ascii=False).encode('utf-8'),
                  headers={'Authorization':'Bearer ' + token, 'Content-Type':'application/json'},
                  method='PATCH'
              )
              with urllib.request.urlopen(req) as resp:
                  if resp.status < 200 or resp.status >= 300:
                      raise RuntimeError(f'{code}: HTTP {resp.status}')
              updated += 1
              print('UPSERT', code)

          print('UPDATED_COUNT=' + str(updated))
          if updated != 45:
              raise SystemExit(f'Expected 45 unique Study Status rows, wrote {updated}')
          PY
