name: EAC hotfix deploy once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eac-hotfix-deploy-once.yml

permissions:
  contents: write

jobs:
  patch-hotfix-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eac-hotfix-20260813
          fetch-depth: 0

      - name: Run guarded EAC patch
        run: python .github/scripts/eac_hotfix.py

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git diff -- index.html
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "chatgpt-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: classify esophageal adenocarcinoma with gastric trials"
          git push origin HEAD:eac-hotfix-20260813
