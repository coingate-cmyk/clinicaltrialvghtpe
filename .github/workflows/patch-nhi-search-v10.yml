name: Patch NHI drug search v1.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-nhi-search-v10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch_nhi_search_v10.py

      - name: Validate JavaScript and data semantics
        run: |
          node --check tools/nhi/assets/clinical-map.js
          node --check tools/nhi/assets/data-lung-support.js
          python - <<'PY'
          from pathlib import Path
          s=Path('tools/nhi/assets/clinical-map.js').read_text(encoding='utf-8')
          assert 'directDrugHay' in s and 'relatedDrugHay' in s
          assert '此藥本身的健保給付' in s
          assert '給付條件或摘要中提及此藥' in s
          assert "cancerBrowseSection.insertAdjacentElement('afterend', lookupBar)" in s
          d=Path('tools/nhi/assets/data-lung-support.js').read_text(encoding='utf-8')
          assert 'lc-afatinib-egfr-1l' in d and 'lc-afatinib-sq-2l' in d and '"id":"lc-afatinib"' not in d
          print('Static validation OK')
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'); global.window=global;
          const html=fs.readFileSync('tools/nhi/index.html','utf8');
          const scripts=[...html.matchAll(/<script src="assets\/(data-[^"]+\.js)"><\/script>/g)].map(m=>m[1]);
          for(const f of scripts) vm.runInThisContext(fs.readFileSync('tools/nhi/assets/'+f,'utf8'),{filename:f});
          const rows=global.NHI_DATA.indications;
          const lungAf=rows.filter(x=>x.drug==='Afatinib' && x.cancer==='lung');
          if(!lungAf.some(x=>x.line_group==='1L') || !lungAf.some(x=>x.line_group==='2L')) throw new Error('Afatinib split missing');
          const q='docetaxel';
          const direct=rows.filter(x=>[x.drug,x.regimen].join(' ').toLowerCase().includes(q));
          const related=rows.filter(x=>![x.drug,x.regimen].join(' ').toLowerCase().includes(q) && [x.setting,x.line,x.line_group,x.biomarker,x.summary,x.review,x.duration,...(x.tags||[])].join(' ').toLowerCase().includes(q));
          console.log('Semantic check:',rows.length,'records;',direct.length,'direct docetaxel;',related.length,'related docetaxel; afatinib lines=',lungAf.map(x=>x.line_group).join(','));
          NODE

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/nhi/assets/clinical-map.js tools/nhi/assets/clinical-map.css tools/nhi/assets/data-lung-support.js
          if ! git diff --cached --quiet; then
            git commit -m "Refine drug lookup semantics and grouping"
            git push origin main
          fi

      - name: Publish to Pages branch
        run: |
          mkdir -p /tmp/nhi-v10
          cp tools/nhi/assets/clinical-map.js /tmp/nhi-v10/
          cp tools/nhi/assets/clinical-map.css /tmp/nhi-v10/
          cp tools/nhi/assets/data-lung-support.js /tmp/nhi-v10/
          git fetch origin pages-clean-ajcc-v2-3
          git switch -C pages-clean-ajcc-v2-3 origin/pages-clean-ajcc-v2-3
          cp /tmp/nhi-v10/clinical-map.js tools/nhi/assets/clinical-map.js
          cp /tmp/nhi-v10/clinical-map.css tools/nhi/assets/clinical-map.css
          cp /tmp/nhi-v10/data-lung-support.js tools/nhi/assets/data-lung-support.js
          git add tools/nhi/assets/clinical-map.js tools/nhi/assets/clinical-map.css tools/nhi/assets/data-lung-support.js
          if ! git diff --cached --quiet; then
            git commit -m "Publish NHI review-oriented drug search v1.0"
            git push origin pages-clean-ajcc-v2-3
          fi
