name: Patch NHI drug search v1.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-nhi-search-v10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply official NHI brand-name search integration
        run: python scripts/patch_nhi_brand_ui.py

      - name: Validate brand search
        run: |
          set -euo pipefail
          node --check tools/nhi/assets/clinical-map.js
          python - <<'PY'
          import json
          from pathlib import Path
          html=Path('tools/nhi/index.html').read_text(encoding='utf-8')
          js=Path('tools/nhi/assets/clinical-map.js').read_text(encoding='utf-8')
          brand=json.loads(Path('tools/nhi/data/brands/current.json').read_text(encoding='utf-8'))
          assert 'assets/nhi-brand-aliases.js' in html
          assert 'officialBrandIndex' in js
          assert 'officialBrandMatches' in js
          assert '健保收載商品名（含原廠 / 學名藥）' in js
          assert brand['meta']['product_count'] >= 1000
          print('Brand search validation OK:',brand['meta']['product_count'],'products')
          PY

      - name: Commit to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/nhi/index.html tools/nhi/assets/clinical-map.js tools/nhi/assets/clinical-map.css
          if ! git diff --cached --quiet; then
            git commit -m "Search oncology reimbursement by NHI-listed brand names"
            git push origin main
          fi
          mkdir -p /tmp/nhi-brand-ui
          cp tools/nhi/index.html /tmp/nhi-brand-ui/
          cp tools/nhi/assets/clinical-map.js /tmp/nhi-brand-ui/
          cp tools/nhi/assets/clinical-map.css /tmp/nhi-brand-ui/

      - name: Publish to Pages branch
        run: |
          set -euo pipefail
          git fetch origin pages-clean-ajcc-v2-3
          git switch -C pages-clean-ajcc-v2-3 origin/pages-clean-ajcc-v2-3
          cp /tmp/nhi-brand-ui/index.html tools/nhi/index.html
          cp /tmp/nhi-brand-ui/clinical-map.js tools/nhi/assets/clinical-map.js
          cp /tmp/nhi-brand-ui/clinical-map.css tools/nhi/assets/clinical-map.css
          git add tools/nhi/index.html tools/nhi/assets/clinical-map.js tools/nhi/assets/clinical-map.css
          if ! git diff --cached --quiet; then
            git commit -m "Publish NHI-listed brand-name search"
            git push origin pages-clean-ajcc-v2-3
          fi
