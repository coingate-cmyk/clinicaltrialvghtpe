name: Patch NHI drug search v1.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_nhi_header_smart_search.py'
      - '.github/workflows/patch-nhi-search-v10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Route header drug / brand searches to drug lookup
        run: python scripts/patch_nhi_header_smart_search.py

      - name: Validate smart brand search
        run: |
          set -euo pipefail
          node --check tools/nhi/assets/clinical-map.js
          python - <<'PY'
          from pathlib import Path
          html=Path('tools/nhi/index.html').read_text(encoding='utf-8')
          js=Path('tools/nhi/assets/clinical-map.js').read_text(encoding='utf-8')
          assert 'function isDrugLikeQuery(q)' in js
          assert 'routeHeaderSearchToDrug' in js
          assert "globalSearch?.addEventListener('input'" in js
          assert "avastin:'bevacizumab'" in js
          assert "opdivo:'nivolumab'" in js
          assert "erbitux:'cetuximab'" in js
          assert '搜尋藥名 / 商品名 / 癌種 / biomarker' in html
          print('Smart header brand routing validation OK')
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'); global.window=global;
          const html=fs.readFileSync('tools/nhi/index.html','utf8');
          const scripts=[...html.matchAll(/<script src="assets\/(data-[^"]+\.js)"><\/script>/g)].map(m=>m[1]);
          for(const f of scripts) vm.runInThisContext(fs.readFileSync('tools/nhi/assets/'+f,'utf8'),{filename:f});
          const rows=global.NHI_DATA.indications;
          const checks={avastin:'bevacizumab',opdivo:'nivolumab',erbitux:'cetuximab'};
          for(const [brand,generic] of Object.entries(checks)) {
            const n=rows.filter(x=>[x.drug,x.regimen].join(' ').toLowerCase().includes(generic));
            if(!n.length) throw new Error(`${brand} -> ${generic} has zero direct records`);
            console.log(brand,'->',generic,':',n.length,'direct records');
          }
          NODE

      - name: Commit to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/nhi/index.html tools/nhi/assets/clinical-map.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix header search for oncology brand names"
            git push origin main
          fi
          mkdir -p /tmp/nhi-smart-search
          cp tools/nhi/index.html /tmp/nhi-smart-search/
          cp tools/nhi/assets/clinical-map.js /tmp/nhi-smart-search/

      - name: Publish to Pages branch
        run: |
          set -euo pipefail
          git fetch origin pages-clean-ajcc-v2-3
          git switch -C pages-clean-ajcc-v2-3 origin/pages-clean-ajcc-v2-3
          cp /tmp/nhi-smart-search/index.html tools/nhi/index.html
          cp /tmp/nhi-smart-search/clinical-map.js tools/nhi/assets/clinical-map.js
          git add tools/nhi/index.html tools/nhi/assets/clinical-map.js
          if ! git diff --cached --quiet; then
            git commit -m "Publish smart NHI brand-name search"
            git push origin pages-clean-ajcc-v2-3
          fi
