name: Manual RECIST homepage patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-recist-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html safely
        run: |
          cat > /tmp/patch_recist.py <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '臨床試驗管理系統 v4.2.1 工具入口版' not in s:
              raise SystemExit('Safety stop: clinical app title missing')
          if 'const INITIAL_TRIALS' not in s:
              raise SystemExit('Safety stop: trial data marker missing')
          if 'RECIST 首頁入口本機 patcher' in s:
              raise SystemExit('Safety stop: patcher file detected')
          marker = "                    e('a', {href: './tools/index.html', target: '_blank', rel: 'noopener', className: toolButtonClass},"
          block = """                    e('a', {href: './tools/recist.html', target: '_blank', rel: 'noopener', className: toolButtonClass},
                        e('div', {className: 'font-semibold text-gray-900'}, 'RECIST 1.1 / TLS Calculator'),
                        e('div', {className: 'text-xs text-gray-500 mt-1'}, 'Target lesion sum、relative to baseline/nadir；本機儲存、JSON 可匯出再匯入')
                    ),
"""
          if './tools/recist.html' not in s:
              if marker not in s:
                  raise SystemExit('Safety stop: tools homepage marker not found')
              s = s.replace(marker, block + marker, 1)
          s = s.replace(
              '提示：工具頁皆為 standalone clinical tools；目前包含 renal/BSA、腫瘤分期與 CTCAE 副作用速查。',
              '提示：工具頁皆為 standalone clinical tools；目前包含 renal/BSA、腫瘤分期、CTCAE 副作用速查與 RECIST/TLS 計算。'
          )
          if 'RECIST 1.1 / TLS Calculator' not in s or './tools/recist.html' not in s:
              raise SystemExit('Safety stop: RECIST block missing after patch')
          p.write_text(s, encoding='utf-8')
          PY
          python3 /tmp/patch_recist.py
      - name: Commit patched homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add RECIST link to homepage tools panel"
            git push
          fi
