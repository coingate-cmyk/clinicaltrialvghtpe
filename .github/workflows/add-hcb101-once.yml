name: One-off add HCB101-201
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-hcb101-once.yml']
permissions:
  contents: read
jobs:
  upsert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upsert HCB101-201 to the app Firestore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/firebase.env
          import re
          s=open('index.html',encoding='utf-8').read()
          for k in ('apiKey','projectId'):
              m=re.search(r"%s:\s*'([^']+)'" % k,s)
              if not m: raise SystemExit('missing '+k)
              print(k+'='+m.group(1))
          PY
          source /tmp/firebase.env
          AUTH_JSON=$(curl -fsS -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${apiKey}" -H 'Content-Type: application/json' --data '{"returnSecureToken":true}')
          ID_TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["idToken"])' <<<"$AUTH_JSON")
          python3 - <<'PY' > /tmp/doc.json
          import json
          def S(x): return {'stringValue':x}
          def B(x): return {'booleanValue':x}
          def A(xs): return {'arrayValue':{'values':xs}}
          def M(d): return {'mapValue':{'fields':d}}
          fields={
            'code':S('HCB101-201'),
            'cancerType':S('胃癌'),
            'line':S('一線、二線'),
            'studyTitle':S('Phase Ib/IIa, Open-label, Multicenter, Dose Escalation, and Dose Expansion Study to Evaluate Safety, Tolerability, Pharmacokinetics, and Antitumor Activity of HCB101 in Combination with Multiple Agents in Subjects with Advanced Solid Tumors'),
            'inclusion':S('主要收案 cohort（Taiwan follow US）：\nCohort 1 GC 1L HER2+：未接受治療之不可切除局部晚期/轉移性胃腺癌；HER2 IHC 3+ 或 IHC 2+/FISH+。\nCohort 2 GC 2L：不可切除局部晚期/復發/轉移性胃腺癌；第一線標準治療後惡化；HER2+ 者第一線須含 trastuzumab。\nCohort 3 CRC 2L：第一線後惡化；dMMR/MSI-H 須曾接受 ICI；3b 不可曾用 cetuximab；3c 不可曾用 irinotecan-based chemo；3d 不可曾用 oxaliplatin-based chemo。\nCohort 4 TNBC 1L：未治療不可切除局部/區域或 M1 TNBC；US pembrolizumab 條件 PD-L1 CPS >=10。\nCohort 5 GC 1L HER2 non-amplified：IHC 2+/FISH-、IHC 1+ 或 IHC 0；US pembrolizumab 條件 PD-L1 CPS >=1。\nCohort 6 HNSCC：6a/6b 1L，R/M disease 未接受系統治療且 CPS >=1；6c 2L，PD-1/PD-L1 therapy 後惡化。\nCohort 7 ovarian cancer：至少 1 prior line，依 HER2 expression 分層。\nCohort 8 HCC 1L：未治療不可切除局部晚期/轉移性 HCC；Child-Pugh A。\nCohort 9 ES-SCLC 1L：未治療 extensive-stage SCLC。\n共通：>=18歲；RECIST 1.1 至少1個 measurable lesion；ECOG 0-1；可提供腫瘤組織；預期壽命 >=12週。HBsAg+ 可收，但 HBV DNA 不得 >500 IU/mL；HCV RNA 必須低於偵測下限。'),
            'exclusion':S('重要排除：active/untreated CNS metastasis 或 carcinomatous meningitis（穩定已治療腦轉移可依 protocol）；顯著未控制心血管疾病；未恢復至 <=Grade 1 的治療毒性（部分穩定 Grade 2 可討論）；出血體質/近期 hemolytic anemia；major surgery 或 radical RT 28天內；近期 systemic antitumor therapy 未達 washout；曾接受 CD47/SIRPalpha pathway therapy；active infection、active HBV/HCV、active TB；近期其他 investigational product/device。'),
            'phase':S('Ib/IIa'),
            'sponsor':S('漢康生技股份有限公司 / HanchorBio Inc.'),
            'targetNum':S(''),'enrolled':S(''),'monthSigned':S(''),'monthEnrolled':S(''),
            'pi':S('張牧新'),'nurse':S('Iris Chang 張家鳳'),'phone':S('65718 / 0900-068-996'),
            'comments':S('Site 201 / Taipei Veterans General Hospital。SIV：2026/04/30；Protocol V3.0。HCB101 IV weekly。\nSlot status（截至 2026/08/10）：Cohort 1 GC 1L HER2+ Phase 2a 8 mg/kg：1 slot open；Cohort 2 GC 2L Phase 2a 8 mg/kg：仍有多個 slot；Cohort 3a CRC 2L：1 slot open；3c：2 slots open；3d：2 slots open；Cohort 4 TNBC 1L：1 slot open；Cohort 5 GC 1L HER2-：0 slot open；Cohort 6a HNSCC 1L：3 slots open；6b：2 slots open；6c：0 slot open。\n2026/08/10 email：Cohort 2Q GC 2L 為新版 protocol 內容，當時 amendment 尚待 IRB 核准。'),
            'status':S('進行中'),'statusSource':S('manual'),'statusDetectedFromText':B(False),'statusManuallyTouched':B(True),
            'updatedBy':S('admin'),'updatedAt':S('2026-09-16T07:30:00Z'),'subjects':A([]),
            'cancerTypes':A([
              M({'type':S('胃癌'),'lines':A([S('一線'),S('二線')])}),
              M({'type':S('大腸癌'),'lines':A([S('二線')])}),
              M({'type':S('肝癌'),'lines':A([S('一線')])}),
              M({'type':S('頭頸癌'),'lines':A([S('一線'),S('二線')])}),
              M({'type':S('三陰性乳癌'),'lines':A([S('一線')])}),
              M({'type':S('卵巢癌'),'lines':A([S('二線以上')])}),
              M({'type':S('小細胞肺癌'),'lines':A([S('一線')])})])
          }
          print(json.dumps({'fields':fields},ensure_ascii=False))
          PY
          URL="https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/trials/HCB101-201"
          CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PATCH "$URL" -H "Authorization: Bearer ${ID_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/doc.json)
          cat /tmp/resp.json
          echo "HTTP ${CODE}"
          test "$CODE" -ge 200 -a "$CODE" -lt 300
          VERIFY=$(curl -sS -o /tmp/verify.json -w '%{http_code}' -H "Authorization: Bearer ${ID_TOKEN}" "$URL")
          cat /tmp/verify.json
          echo "VERIFY HTTP ${VERIFY}"
          grep -q 'HCB101-201' /tmp/verify.json
          test "$VERIFY" -eq 200
