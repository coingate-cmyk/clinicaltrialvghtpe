name: Weekly NHI Oncology Update

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC; Taiwan Monday 10:15.
    - cron: '15 2 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/nhi_update.py'
      - 'scripts/nhi_update_reader.py'
      - 'scripts/normalize_nhi_coverage.py'
      - 'scripts/build_nhi_candidates.py'
      - '.github/workflows/nhi-weekly-update.yml'

permissions:
  contents: write

concurrency:
  group: nhi-weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Fetch official NHI chapter 9 with verified-source fallback
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/nhi_update.py; then
            echo 'Direct official NHI ODT fetch succeeded.'
          else
            echo 'Direct NHI access unavailable; trying reader and the last verified official PDF link.'
            python scripts/nhi_update_reader.py
          fi
          python scripts/normalize_nhi_coverage.py
          python scripts/build_nhi_candidates.py

      - name: Validate new NHI snapshot before publishing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('tools/nhi')
          current = json.loads((root / 'data/raw/current.json').read_text(encoding='utf-8'))
          coverage = json.loads((root / 'data/coverage-report.json').read_text(encoding='utf-8'))
          review = json.loads((root / 'data/review-queue.json').read_text(encoding='utf-8'))
          src = current.get('source', {})
          assert current['section_count'] >= 80, 'Official NHI chapter 9 appears truncated'
          assert '9.1' in current['sections'], 'Chapter 9 missing first section'
          assert coverage['status'] == 'ok' and review['status'] == 'ok'
          assert coverage.get('orphan_count', 0) == 0, coverage.get('orphans')
          assert src.get('page') == 'https://www.nhi.gov.tw/ch/cp-7593-ad2a9-3397-1.html'
          if src.get('source_discovery') == 'last-verified-official-pdf-link':
              assert src.get('pdf', '').startswith('https://www.nhi.gov.tw/ch/dl-')
              assert not src.get('source_update'), 'Cached link must not assert a fresh source date'
              print('WARNING: PDF link is official, but current official page date could not be verified.')
          assert (root / 'assets/nhi-status.js').stat().st_size > 50
          assert (root / 'assets/nhi-candidates.js').stat().st_size > 500
          print('NHI validation OK:', current['section_count'], 'sections;',
                current.get('fetched_at'), 'source update:', src.get('source_update', 'unverified'))
          PY

      - name: Commit validated NHI snapshots and candidate index to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/nhi/data/raw/current.json \
                  tools/nhi/data/snapshots \
                  tools/nhi/data/changes.json \
                  tools/nhi/data/coverage-report.json \
                  tools/nhi/data/review-queue.json \
                  tools/nhi/assets/nhi-status.js \
                  tools/nhi/assets/nhi-candidates.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update official NHI oncology coverage snapshot'
            git pull --rebase origin main
            git push origin main
          fi
          rm -rf /tmp/nhi-publish
          mkdir -p /tmp/nhi-publish/data/raw /tmp/nhi-publish/data/snapshots /tmp/nhi-publish/assets
          cp tools/nhi/data/raw/current.json /tmp/nhi-publish/data/raw/current.json
          cp -a tools/nhi/data/snapshots/. /tmp/nhi-publish/data/snapshots/
          for f in changes.json coverage-report.json review-queue.json; do
            cp "tools/nhi/data/$f" "/tmp/nhi-publish/data/$f"
          done
          cp tools/nhi/assets/nhi-status.js tools/nhi/assets/nhi-candidates.js /tmp/nhi-publish/assets/

      - name: Publish NHI-only assets to Pages without overwriting TFDA or brands
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin pages-clean-ajcc-v2-3
          git switch -C pages-clean-ajcc-v2-3 origin/pages-clean-ajcc-v2-3
          mkdir -p tools/nhi/data/raw tools/nhi/data/snapshots tools/nhi/assets
          cp /tmp/nhi-publish/data/raw/current.json tools/nhi/data/raw/current.json
          cp -a /tmp/nhi-publish/data/snapshots/. tools/nhi/data/snapshots/
          for f in changes.json coverage-report.json review-queue.json; do
            cp "/tmp/nhi-publish/data/$f" "tools/nhi/data/$f"
          done
          cp /tmp/nhi-publish/assets/nhi-status.js /tmp/nhi-publish/assets/nhi-candidates.js tools/nhi/assets/
          git add tools/nhi/data/raw/current.json \
                  tools/nhi/data/snapshots \
                  tools/nhi/data/changes.json \
                  tools/nhi/data/coverage-report.json \
                  tools/nhi/data/review-queue.json \
                  tools/nhi/assets/nhi-status.js \
                  tools/nhi/assets/nhi-candidates.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publish official NHI oncology coverage snapshot'
            git pull --rebase origin pages-clean-ajcc-v2-3
            git push origin pages-clean-ajcc-v2-3
          fi
