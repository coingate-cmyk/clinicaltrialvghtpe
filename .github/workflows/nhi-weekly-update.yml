name: Weekly NHI Oncology Update

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC: Monday 02:15 = Taiwan Monday 10:15
    - cron: '15 2 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/nhi_update.py'
      - 'scripts/nhi_update_reader.py'
      - 'scripts/normalize_nhi_coverage.py'
      - 'scripts/build_nhi_candidates.py'
      - 'tools/nhi/config/cancer_aliases.json'
      - '.github/workflows/nhi-weekly-update.yml'

permissions:
  contents: write

concurrency:
  group: nhi-weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Use browser-compatible NHI request headers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/nhi_update.py')
          s=p.read_text(encoding='utf-8')
          old='SESSION.headers.update({"User-Agent": "clinicaltrialvghtpe NHI updater/1.0 (+GitHub Actions; clinical reference mirror)"})'
          new='SESSION.headers.update({"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36", "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8", "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.7", "Referer": "https://www.nhi.gov.tw/"})'
          if old not in s:
              raise SystemExit('NHI session header anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Fetch chapter 9 and build audit
        shell: bash
        run: |
          set -uo pipefail
          if python scripts/nhi_update.py; then
            echo 'Direct official ODT fetch succeeded.'
          else
            echo 'Direct NHI fetch blocked/failed; trying reader transport against official page/PDF.'
            python scripts/nhi_update_reader.py
          fi
          python scripts/normalize_nhi_coverage.py
          python scripts/build_nhi_candidates.py

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          current=json.loads(Path('tools/nhi/data/raw/current.json').read_text(encoding='utf-8'))
          coverage=json.loads(Path('tools/nhi/data/coverage-report.json').read_text(encoding='utf-8'))
          review=json.loads(Path('tools/nhi/data/review-queue.json').read_text(encoding='utf-8'))
          assert current['section_count'] >= 80, current['section_count']
          assert coverage['status'] == 'ok'
          assert review['status'] == 'ok'
          assert current['source'].get('page','').startswith('https://www.nhi.gov.tw/')
          assert coverage.get('orphan_count', 0) == 0, coverage.get('orphans')
          assert Path('tools/nhi/assets/nhi-status.js').stat().st_size > 50
          candidate_js=Path('tools/nhi/assets/nhi-candidates.js')
          assert candidate_js.stat().st_size > 500
          print('NHI validation OK:', current['section_count'], 'sections;', coverage['missing_candidate_count'], 'coverage candidates to review')
          PY

      - name: Commit source snapshot and review queue to main
        shell: bash
        run: |
          set -euo pipefail
          # Do not commit the temporary runtime header substitution.
          git checkout -- scripts/nhi_update.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/nhi/data tools/nhi/assets/nhi-status.js tools/nhi/assets/nhi-candidates.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update NHI chapter 9 snapshot and audit'
            git push origin main
          fi
          rm -rf /tmp/nhi-data
          mkdir -p /tmp/nhi-data
          cp -a tools/nhi/data /tmp/nhi-data/data
          cp tools/nhi/assets/nhi-status.js /tmp/nhi-data/nhi-status.js
          cp tools/nhi/assets/nhi-candidates.js /tmp/nhi-data/nhi-candidates.js

      - name: Publish generated audit data to live Pages branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin pages-clean-ajcc-v2-3
          git switch -C pages-clean-ajcc-v2-3 origin/pages-clean-ajcc-v2-3
          rm -rf tools/nhi/data
          mkdir -p tools/nhi/assets
          cp -a /tmp/nhi-data/data tools/nhi/data
          cp /tmp/nhi-data/nhi-status.js tools/nhi/assets/nhi-status.js
          cp /tmp/nhi-data/nhi-candidates.js tools/nhi/assets/nhi-candidates.js
          git add tools/nhi/data tools/nhi/assets/nhi-status.js tools/nhi/assets/nhi-candidates.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publish NHI chapter 9 audit data'
            git push origin pages-clean-ajcc-v2-3
          fi

