name: Legacy AJCC breast repair wrapper

# The old implementation restored Breast rows from working-reference extraction files.
# Those files can contain prognostic-stage rows whose grade/ER/PR/HER2 conditions are
# not represented in the TNM-only quick form. Keep this workflow only as a manual
# compatibility wrapper around the audited core repair.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safe-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run audited AJCC core repair
        run: python scripts/repair_ajcc_core_staging.py

      - name: Validate no extracted prognostic Breast rows returned
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          for fn in ['tools/staging_rules_7.csv','tools/staging_rules_8.csv']:
              rows=list(csv.DictReader(open(fn,encoding='utf-8-sig')))
              br=[r for r in rows if r.get('site')=='Breast']
              assert len(br)==12, (fn,len(br))
              assert all((r.get('classification') or '').lower()=='any' for r in br)
              assert all('auto_extracted' not in (r.get('note') or '').lower() for r in br)
              assert all('prognostic stage from hidden' in (r.get('note') or '').lower() for r in br)
          html=Path('tools/quick-staging.html').read_text(encoding='utf-8')
          assert 'value="" selected>請先選擇 / Select basis' in html
          assert html.count('"site":"Breast"')==24
          print('Legacy wrapper safety validation PASS')
          PY

      - name: Commit if repair changed canonical files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/staging_rules_7.csv tools/staging_rules_8.csv tools/quick-staging.html
          if ! git diff --cached --quiet; then
            git commit -m "Run safe AJCC core repair"
            git push origin main
          fi
          cp tools/quick-staging.html /tmp/quick-staging.html

      - name: Publish safe AJCC tool
        run: |
          git fetch origin pages-clean-ajcc-v2-3
          git switch -C pages-clean-ajcc-v2-3 origin/pages-clean-ajcc-v2-3
          mkdir -p tools
          cp /tmp/quick-staging.html tools/quick-staging.html
          git add tools/quick-staging.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish safe AJCC core repair"
            git push origin pages-clean-ajcc-v2-3
          fi
