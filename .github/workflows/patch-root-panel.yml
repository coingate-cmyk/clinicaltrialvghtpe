name: Patch root login panel

on:
  push:
    paths:
      - 'tools/root_panel_patch_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          before = s
          s = s.replace('臨床試驗管理系統 v4.1.9 Firebase版', '臨床試驗管理系統 v4.2.1 Firebase版')
          s = s.replace("e('a', {href: './tools/staging.html', target: '_blank', rel: 'noopener', className: toolButtonClass},\n                        e('div', {className: 'font-semibold text-gray-900'}, 'AJCC 7/8 staging 查詢'),\n                        e('div', {className: 'text-xs text-gray-500 mt-1'}, 'GI oncology cancer sites；目前為測試 rule pack，可逐步換成院內版')\n                    ),\n                    e('a', {href: './tools/index.html', target: '_blank', rel: 'noopener', className: toolButtonClass},",
          "e('a', {href: './tools/quick-staging.html', target: '_blank', rel: 'noopener', className: toolButtonClass},\n                        e('div', {className: 'font-semibold text-gray-900'}, '腫瘤分期速查器'),\n                        e('div', {className: 'text-xs text-gray-500 mt-1'}, '6.0 / 7.0 / 8.0；目前 7.0 規則自動載入，8.0 日後補院內版')\n                    ),\n                    e('a', {href: './tools/ctcae.html', target: '_blank', rel: 'noopener', className: toolButtonClass},\n                        e('div', {className: 'font-semibold text-gray-900'}, 'CTCAE 副作用速查器'),\n                        e('div', {className: 'text-xs text-gray-500 mt-1'}, '常用 oncology AE；免疫治療、ADC、targeted therapy 相關副作用 quick check')\n                    ),\n                    e('a', {href: './tools/index.html', target: '_blank', rel: 'noopener', className: toolButtonClass},")
          s = s.replace('提示：如果工具頁開不到，請確認 GitHub repo 根目錄下有 tools/renal.html 與 tools/staging.html。',
                        '提示：工具頁皆為 standalone clinical tools；目前包含 renal/BSA、腫瘤分期與 CTCAE 副作用速查。')
          if s == before:
              print('No changes made; pattern may already be patched or not found.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Patched index.html')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index.html changes to commit'
          else
            git commit -m 'Patch root login tools panel'
            git push
          fi