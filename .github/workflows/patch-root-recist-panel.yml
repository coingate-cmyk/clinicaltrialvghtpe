name: Patch root RECIST panel

on:
  push:
    paths:
      - '.github/trigger-recist-panel.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html root tools panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """                    e('a', {href: './tools/ctcae.html', target: '_blank', rel: 'noopener', className: toolButtonClass},
                        e('div', {className: 'font-semibold text-gray-900'}, 'CTCAE 副作用速查器'),
                        e('div', {className: 'text-xs text-gray-500 mt-1'}, '常用 oncology AE；免疫治療、ADC、targeted therapy 相關副作用 quick check')
                    ),
                    e('a', {href: './tools/index.html', target: '_blank', rel: 'noopener', className: toolButtonClass},"""
          new = """                    e('a', {href: './tools/ctcae.html', target: '_blank', rel: 'noopener', className: toolButtonClass},
                        e('div', {className: 'font-semibold text-gray-900'}, 'CTCAE 副作用速查器'),
                        e('div', {className: 'text-xs text-gray-500 mt-1'}, '常用 oncology AE；免疫治療、ADC、targeted therapy 相關副作用 quick check')
                    ),
                    e('a', {href: './tools/recist.html', target: '_blank', rel: 'noopener', className: toolButtonClass},
                        e('div', {className: 'font-semibold text-gray-900'}, 'RECIST 1.1 / TLS Calculator'),
                        e('div', {className: 'text-xs text-gray-500 mt-1'}, 'Target lesion sum、relative to baseline/nadir；本機儲存、JSON 可匯出再匯入')
                    ),
                    e('a', {href: './tools/index.html', target: '_blank', rel: 'noopener', className: toolButtonClass},"""
          if old not in s and "./tools/recist.html" not in s:
              raise SystemExit('target block not found')
          if "./tools/recist.html" not in s:
              s = s.replace(old, new)
          s = s.replace('提示：工具頁皆為 standalone clinical tools；目前包含 renal/BSA、腫瘤分期與 CTCAE 副作用速查。',
                        '提示：工具頁皆為 standalone clinical tools；目前包含 renal/BSA、腫瘤分期、CTCAE 副作用速查與 RECIST/TLS 計算。')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" || git commit -m "Add RECIST link to root tools panel"
          git push