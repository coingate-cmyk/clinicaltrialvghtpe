name: Complete NHI v0.4 Curated Coverage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nhi-v04-completeness.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Append reviewed supporting sections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          additions = {
          'tools/nhi/assets/data-breast.js': r'''
window.NHI_DATA.indications.push(...[
{"id":"bc-aromatase-inhibitors","cancer":"breast","drug":"Aromatase inhibitors","regimen":"Exemestane / anastrozole / letrozole","setting":"HR+ 早期 / 局部晚期 / 轉移性乳癌","line":"內分泌治療","biomarker":"ER+ / HR+；停經後或卵巢切除後依品項條件","prior_auth":false,"review":"依各 AI 之 tamoxifen 既往治療與早期輔助條件","duration":"早期輔助依品項最高3–5年","section":"9.1","pdf_page":1,"effective":"105/8/1","status":"給付","summary":"Exemestane、anastrozole、letrozole 依第9.1節用於停經後 HR+ 早期、局部晚期或轉移性乳癌；各品項有不同既往 tamoxifen 與療程限制。","tags":["HR+","endocrine","AI"],"line_group":"內分泌"},
{"id":"bc-carboplatin-tnbc-support","cancer":"breast","drug":"Carboplatin","regimen":"Carboplatin + paclitaxel + pembrolizumab","setting":"Stage II–IIIb 早期 TNBC","line":"術前前導","biomarker":"ER-/PR-/HER2-；cT1c N1-2 或 T2-4 N0-2","prior_auth":true,"review":"需同時符合 pembrolizumab 第9.69節 / P131","duration":"含 carboplatin/paclitaxel 階段最多4療程","section":"9.2","pdf_page":2,"effective":"114/6/1","status":"給付","summary":"Carboplatin 可與 paclitaxel、pembrolizumab 併用於符合條件的早期 TNBC 術前前導治療；ICI 條件另依第9.69節。","tags":["TNBC","carboplatin","neoadjuvant"],"line_group":"早期"},
{"id":"bc-toremifene","cancer":"breast","drug":"Toremifene","regimen":"Toremifene monotherapy","setting":"轉移性乳癌","line":"內分泌治療","biomarker":"ER+；停經後","prior_auth":false,"review":"限停經後 ER+ 轉移性乳癌","duration":"依治療反應","section":"9.8","pdf_page":5,"effective":"88/6/1","status":"給付","summary":"Toremifene 限用於停經後且 ER+ 的轉移性乳癌。","tags":["ER+","endocrine"],"line_group":"內分泌"},
{"id":"bc-vinorelbine","cancer":"breast","drug":"Vinorelbine","regimen":"Vinorelbine","setting":"轉移性乳癌","line":"化療","biomarker":"—","prior_auth":false,"review":"依第9.9節","duration":"依療程","section":"9.9","pdf_page":5,"effective":"106/11/1","status":"給付","summary":"Vinorelbine 可用於轉移性乳癌；口服與注射劑型不得併用。","tags":["chemotherapy","vinorelbine"],"line_group":"化療"},
{"id":"bc-ufur","cancer":"breast","drug":"Uracil-Tegafur (UFT/Ufur)","regimen":"Uracil-Tegafur","setting":"轉移性乳癌","line":"化療","biomarker":"—","prior_auth":false,"review":"依第9.11節","duration":"依療程","section":"9.11","pdf_page":6,"effective":"97/12/1","status":"給付","summary":"Uracil-Tegafur 可依第9.11節用於轉移性乳癌。","tags":["chemotherapy","oral fluoropyrimidine"],"line_group":"化療"},
{"id":"bc-liposomal-doxo","cancer":"breast","drug":"Liposomal doxorubicin","regimen":"Doxorubicin hydrochloride liposome injection","setting":"轉移性乳癌且有心臟疾病風險考量","line":"化療","biomarker":"—","prior_auth":false,"review":"限單藥且有心臟疾病風險考量","duration":"依療程","section":"9.14","pdf_page":7,"effective":"93/11/1","status":"給付","summary":"Liposomal doxorubicin 可單藥用於有心臟疾病風險考量之轉移性乳癌。","tags":["chemotherapy","liposomal doxorubicin"],"line_group":"化療"},
{"id":"bc-everolimus-exemestane","cancer":"breast","drug":"Everolimus","regimen":"Everolimus + exemestane","setting":"HR+/HER2- 轉移性乳癌","line":"非類固醇 AI 後","biomarker":"HR+ / HER2-；無 visceral crisis；未曾用 exemestane","prior_auth":true,"review":"每3個月；與 tucidinostat 擇一，除不耐受不得互換","duration":"至惡化/不耐受","section":"9.36","pdf_page":21,"effective":"114/12/1","status":"給付","summary":"非類固醇 AI 治療失敗、未曾使用 exemestane、HR+/HER2- 且無 visceral crisis 的轉移性乳癌，可用 everolimus + exemestane。","tags":["HR+","HER2-","everolimus","exemestane"],"line_group":"2L+"},
{"id":"bc-ixabepilone","cancer":"breast","drug":"Ixabepilone","regimen":"Ixabepilone + capecitabine","setting":"局部晚期 / 轉移性乳癌","line":"後線","biomarker":"—","prior_auth":false,"review":"taxane resistant + anthracycline 不適合，或 taxane/anthracycline 均無效；每3療程評估","duration":"至惡化；與 eribulin 擇一且不得互換","section":"9.88","pdf_page":71,"effective":"110/2/1","status":"給付","summary":"符合 taxane/anthracycline 既往治療條件的局部晚期或轉移性乳癌，可用 ixabepilone + capecitabine；與 eribulin 擇一。","tags":["chemotherapy","ixabepilone"],"line_group":"後線"},
{"id":"bc-fulvestrant","cancer":"breast","drug":"Fulvestrant","regimen":"Fulvestrant ± palbociclib / alpelisib / capivasertib","setting":"ER+ 局部晚期 / 轉移性乳癌","line":"內分泌治療 / post-CDK4/6","biomarker":"ER+；併標靶時另依 PIK3CA/AKT1/PTEN 或 CDK4/6 條件","prior_auth":false,"review":"單藥：輔助 anti-estrogen 後復發或治療中惡化；併用時須符合搭配藥給付","duration":"依搭配治療","section":"9.130","pdf_page":99,"effective":"115/6/1","status":"給付","summary":"Fulvestrant 可單用於停經後 ER+ 局部晚期/轉移性乳癌；亦可依相應條件與 palbociclib、alpelisib 或 capivasertib 併用。","tags":["ER+","fulvestrant","endocrine"],"line_group":"內分泌"}
]);
''',
          'tools/nhi/assets/data-lung.js': r'''
window.NHI_DATA.indications.push(...[
{"id":"lc-carboplatin-support","cancer":"lung","drug":"Carboplatin","regimen":"Carboplatin-based combinations","setting":"NSCLC / extensive-stage SCLC / EGFR exon20 NSCLC","line":"第一線 / 術前依情境","biomarker":"依 ICI 或 EGFR exon20 條件","prior_auth":false,"review":"若併 ICI/amivantamab 須同時符合相應標靶/ICI 給付","duration":"依療程；nivolumab 術前最多3療程","section":"9.2","pdf_page":2,"effective":"115/8/1","status":"給付","summary":"Carboplatin 可依第9.2節搭配 pembrolizumab、atezolizumab、durvalumab、amivantamab 或 nivolumab 等，用於對應 NSCLC/SCLC 情境。","tags":["carboplatin","chemotherapy"],"line_group":"化療"},
{"id":"lc-docetaxel","cancer":"lung","drug":"Docetaxel","regimen":"Docetaxel","setting":"局部晚期 / 轉移性 NSCLC","line":"化療","biomarker":"—","prior_auth":false,"review":"依許可適應症與第9.3節","duration":"依療程","section":"9.3","pdf_page":3,"effective":"115/8/1","status":"給付","summary":"Docetaxel 類藥品可依第9.3節用於局部晚期或轉移性 NSCLC。","tags":["NSCLC","docetaxel"],"line_group":"化療"},
{"id":"lc-gemcitabine","cancer":"lung","drug":"Gemcitabine","regimen":"Gemcitabine-based chemotherapy","setting":"晚期 / 無法手術切除 NSCLC","line":"化療","biomarker":"—","prior_auth":false,"review":"依第9.4節；併其他標靶/ICI 時須符合搭配藥條件","duration":"依療程","section":"9.4","pdf_page":4,"effective":"115/6/1","status":"給付","summary":"Gemcitabine 可依許可適應症用於 NSCLC；特定品項限晚期或無法手術切除 NSCLC。","tags":["NSCLC","gemcitabine"],"line_group":"化療"},
{"id":"lc-paclitaxel","cancer":"lung","drug":"Paclitaxel","regimen":"Paclitaxel-based chemotherapy","setting":"NSCLC","line":"第一線 / 依情境","biomarker":"—","prior_auth":false,"review":"部分品項第一線需與 cisplatin 併用；ICI 組合另依 ICI 規定","duration":"依療程","section":"9.5","pdf_page":4,"effective":"115/8/1","status":"給付","summary":"Paclitaxel 可用於 NSCLC；亦是 pembrolizumab+carboplatin 鱗狀 NSCLC 與 atezolizumab+bevacizumab+carboplatin 非鱗狀 NSCLC 組合的一部分。","tags":["NSCLC","paclitaxel"],"line_group":"化療"},
{"id":"lc-vinorelbine","cancer":"lung","drug":"Vinorelbine","regimen":"Vinorelbine ± platinum","setting":"NSCLC；術後輔助或晚期","line":"Adjuvant / advanced","biomarker":"—","prior_auth":false,"review":"Stage II/IIIA 根治手術後與 platinum 併用最多4療程","duration":"術後輔助最多4療程","section":"9.9","pdf_page":5,"effective":"106/11/1","status":"給付","summary":"Vinorelbine 可用於晚期/不可切除 NSCLC；Stage II–IIIA 根治手術後可與 platinum 併用作輔助治療最多4療程。","tags":["NSCLC","vinorelbine","adjuvant"],"line_group":"化療"},
{"id":"lc-ufur","cancer":"lung","drug":"Uracil-Tegafur (UFT/Ufur)","regimen":"UFT ± cisplatin","setting":"肺癌；術後輔助 / 晚期","line":"Adjuvant / advanced","biomarker":"—","prior_auth":false,"review":"T2 且腫瘤≥3cm 肺腺癌術後可用2年；晚期可與 cisplatin 併用","duration":"術後輔助最多2年","section":"9.11","pdf_page":6,"effective":"100/1/1","status":"給付","summary":"UFT 可與 cisplatin 併用治療轉移/末期肺癌；T2 且腫瘤≥3cm 肺腺癌根治手術後可作輔助治療最多2年。","tags":["lung","UFT","adjuvant"],"line_group":"化療"},
{"id":"lc-topotecan-sclc","cancer":"lung","drug":"Topotecan","regimen":"Topotecan","setting":"SCLC","line":"第二線","biomarker":"—","prior_auth":false,"review":"第一線須包括 platinum","duration":"依療程","section":"9.16","pdf_page":7,"effective":"100/6/1","status":"給付","summary":"注射或口服 topotecan 可依第9.16節用於 SCLC 第二線，第一線治療應包括 platinum。","tags":["SCLC","topotecan"],"line_group":"2L"},
{"id":"lc-pemetrexed","cancer":"lung","drug":"Pemetrexed","regimen":"Pemetrexed ± platinum / pembrolizumab / amivantamab / nivolumab","setting":"非鱗狀 NSCLC","line":"1L / 2L+ / 術前","biomarker":"依 ICI/EGFR exon20/driver 條件","prior_auth":false,"review":"單藥或 platinum 組合依 ECOG/既往療法；併標靶或 ICI 須符合搭配藥規定","duration":"每4療程評估","section":"9.26","pdf_page":14,"effective":"115/8/1","status":"給付","summary":"Pemetrexed 可用於非鱗狀 NSCLC 一線含鉑化療或含鉑後單藥，也可依條件加入 pembrolizumab、amivantamab 或 nivolumab 組合。","tags":["NSCLC","nonsquamous","pemetrexed"],"line_group":"化療"},
{"id":"lc-erlotinib","cancer":"lung","drug":"Erlotinib","regimen":"Erlotinib ± bevacizumab","setting":"肺腺癌 / NSCLC","line":"EGFR 1L；亦保留特定 maintenance / later-line 條件","biomarker":"EGFR-TK mutation；bev+erlotinib: exon21 L858R + brain metastasis","prior_auth":false,"review":"定期影像；與其他 EGFR TKI 依第9.29節互斥","duration":"至惡化/不耐受","section":"9.29","pdf_page":16,"effective":"115/8/1","status":"給付","summary":"Erlotinib 可用於 EGFR-mutated 肺腺癌第一線；另保留含鉑後 SD maintenance、特定後線與 exon21 L858R 腦轉移合併 bevacizumab 情境。","tags":["EGFR","erlotinib"],"line_group":"1L / 後線"},
{"id":"lc-bev-erlotinib","cancer":"lung","drug":"Bevacizumab","regimen":"Bevacizumab + erlotinib","setting":"Stage IV 非鱗狀 NSCLC 肺腺癌合併腦轉移","line":"第一線","biomarker":"EGFR exon21 L858R","prior_auth":true,"review":"每12週；初申請檢附 EGFR L858R 報告","duration":"至惡化","section":"9.37","pdf_page":22,"effective":"114/3/1","status":"給付","summary":"無法手術切除 Stage IV、EGFR exon21 L858R 且有腦轉移的非鱗狀 NSCLC，可用 bevacizumab + erlotinib 第一線。","tags":["EGFR L858R","bevacizumab","brain metastasis"],"line_group":"1L"},
{"id":"lc-afatinib","cancer":"lung","drug":"Afatinib","regimen":"Afatinib monotherapy","setting":"EGFR-mutated 肺腺癌；或 platinum 後鱗狀 NSCLC","line":"1L EGFR / 2L squamous","biomarker":"EGFR-TK mutation（1L）","prior_auth":false,"review":"每8–12週療效評估；第一線與其他 EGFR TKI 依條文擇一","duration":"至惡化/不耐受","section":"9.45","pdf_page":30,"effective":"115/8/1","status":"給付","summary":"Afatinib 可用於 EGFR-mutated 局部晚期/轉移性肺腺癌第一線；亦可用於含鉑治療後惡化的鱗狀 NSCLC 第二線。","tags":["EGFR","afatinib","squamous"],"line_group":"1L / 2L"},
{"id":"lc-ts1","cancer":"lung","drug":"Tegafur/gimeracil/oteracil (S-1)","regimen":"S-1 monotherapy","setting":"局部晚期 / 轉移性 NSCLC","line":"含鉑化療失敗後","biomarker":"—","prior_auth":false,"review":"不得與標靶、其他化療或 ICI 併用","duration":"至惡化","section":"9.46","pdf_page":30,"effective":"109/2/1","status":"給付","summary":"含鉑化療治療失敗的局部晚期或轉移性 NSCLC，可用 S-1；不得與標靶、其他化療或 ICI 併用。","tags":["NSCLC","S-1"],"line_group":"2L+"},
{"id":"lc-ceritinib","cancer":"lung","drug":"Ceritinib","regimen":"Ceritinib monotherapy","setting":"ALK+ 晚期 NSCLC","line":"第一線","biomarker":"ALK positive","prior_auth":true,"review":"每3個月；ALK 報告；與其他 ALK TKI 1L 擇一","duration":"至惡化","section":"9.59","pdf_page":39,"effective":"113/6/1","status":"給付","summary":"Ceritinib 可作為 ALK+ 晚期 NSCLC 第一線；與 crizotinib、alectinib、brigatinib、lorlatinib 擇一，除嚴重不耐受不得互換。","tags":["ALK","ceritinib"],"line_group":"1L"}
]);
''',
          'tools/nhi/assets/data-prostate.js': r'''
window.NHI_DATA.indications.push(...[
{"id":"pc-estramustine","cancer":"prostate","drug":"Estramustine phosphate","regimen":"Estramustine","setting":"晚期攝護腺癌","line":"荷爾蒙治療後 / 特定初治高風險","biomarker":"—","prior_auth":false,"review":"荷爾蒙治療無效，或單獨荷爾蒙治療預後不佳之初治患者","duration":"依療程","section":"9.19","pdf_page":9,"effective":"91/4/1","status":"給付","summary":"Estramustine 可用於晚期攝護腺癌之荷爾蒙治療無效者，或預期單獨荷爾蒙治療療效不佳的特定初治患者。","tags":["prostate","estramustine"],"line_group":"其他"},
{"id":"pc-flutamide-buserelin","cancer":"prostate","drug":"Flutamide / Buserelin","regimen":"Flutamide / buserelin hormonal therapy","setting":"T2–T3 / 復發 / 晚期攝護腺癌","line":"Neoadjuvant / biochemical recurrence / advanced","biomarker":"—","prior_auth":false,"review":"依 T stage、PSA recurrence 或轉移情境","duration":"依治療情境","section":"9.39","pdf_page":24,"effective":"101/7/1","status":"給付","summary":"Flutamide/buserelin 可用於晚期攝護腺癌、根除性攝護腺切除後 PSA 上升且局部復發/遠轉移，以及 T2–T3 定效治療前 neoadjuvant tumor reduction。","tags":["prostate","ADT","flutamide","buserelin"],"line_group":"荷爾蒙"},
{"id":"pc-bicalutamide","cancer":"prostate","drug":"Bicalutamide","regimen":"Bicalutamide + LHRH analogue / surgical castration","setting":"進展性攝護腺癌","line":"荷爾蒙治療","biomarker":"—","prior_auth":false,"review":"須與 LHRH analogue 或手術去勢併用","duration":"依治療反應","section":"9.40","pdf_page":24,"effective":"101/7/1","status":"給付","summary":"Bicalutamide 限與 LHRH analogue 或手術去勢併用於進展性攝護腺癌。","tags":["prostate","ADT","bicalutamide"],"line_group":"荷爾蒙"}
]);
'''
          }

          for filename, block in additions.items():
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              marker = {'tools/nhi/assets/data-breast.js':'bc-aromatase-inhibitors', 'tools/nhi/assets/data-lung.js':'lc-carboplatin-support', 'tools/nhi/assets/data-prostate.js':'pc-estramustine'}[filename]
              if marker not in s:
                  p.write_text(s.rstrip() + '\n' + block.strip() + '\n', encoding='utf-8')
          PY

      - name: Commit completeness records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/nhi/assets/data-breast.js tools/nhi/assets/data-lung.js tools/nhi/assets/data-prostate.js
          git commit -m 'Complete curated breast lung and prostate NHI section coverage'
          git push origin main

      - name: Publish completeness records to Pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nhi-complete && mkdir -p /tmp/nhi-complete
          cp tools/nhi/assets/data-breast.js /tmp/nhi-complete/
          cp tools/nhi/assets/data-lung.js /tmp/nhi-complete/
          cp tools/nhi/assets/data-prostate.js /tmp/nhi-complete/
          git fetch origin pages-clean-ajcc-v2-3
          git switch -C pages-clean-ajcc-v2-3 origin/pages-clean-ajcc-v2-3
          cp /tmp/nhi-complete/* tools/nhi/assets/
          git add tools/nhi/assets/data-breast.js tools/nhi/assets/data-lung.js tools/nhi/assets/data-prostate.js
          git commit -m 'Publish complete curated NHI coverage for v0.4'
          git push origin pages-clean-ajcc-v2-3
