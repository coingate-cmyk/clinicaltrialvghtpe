<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臨床工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <main class="max-w-4xl mx-auto p-6">
    <a href="../index.html" class="text-blue-700 hover:underline">← 回臨床試驗系統</a>
    <h1 class="text-3xl font-bold mt-6 mb-2">臨床工具</h1>
    <p class="text-slate-600 mb-6">院內 quick-check tools；分期與 CTCAE 工具不使用 Firebase、不同步。</p>
    <div class="grid md:grid-cols-2 gap-4">
      <a class="block bg-white rounded-xl border p-5 shadow hover:shadow-md" href="./renal.html">
        <div class="text-xl font-bold text-blue-800">腎功能 / BSA 計算機</div>
        <div class="text-slate-600 mt-2">Cockcroft-Gault、CKD-EPI 2021、MDRD、BSA、trial cutoff。</div>
      </a>
      <a class="block bg-white rounded-xl border p-5 shadow hover:shadow-md" href="./quick-staging.html">
        <div class="text-xl font-bold text-emerald-800">腫瘤分期速查器</div>
        <div class="text-slate-600 mt-2">6.0 / 7.0 / 8.0；目前 7.0 規則自動載入，8.0 日後補院內版。</div>
      </a>
      <a class="block bg-white rounded-xl border p-5 shadow hover:shadow-md" href="./ctcae.html">
        <div class="text-xl font-bold text-rose-800">CTCAE 副作用速查器</div>
        <div class="text-slate-600 mt-2">常用 oncology AE：neutropenia、anemia、platelet、ALT/AST、bilirubin、diarrhea 等。</div>
      </a>
    </div>
  </main>
</body>
</html>
